sharedWorkspaceLockfile: false
catalogMode: prefer
cleanupUnusedCatalogs: true

# Runtimes are supplied by fnm (node) and jup (pnpm); pnpm must not self-manage.
runtime: false

minimumReleaseAge: 360 # 6 hours
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@unhead/bundler'
  - '@unhead/vue'
  - '@nuxt/kit-nightly'
  - '@nuxt/nitro-server-nightly'
  - '@nuxt/schema-nightly'
  - '@nuxt/vite-builder-nightly'
  - nuxt-nightly
  - unhead
  - verkit

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

strictPeerDependencies: false
shamefullyHoist: true

lockfile:
  format: v13

shellEmulator: true
pmOnFail: ignore

packages:
  - ./
  - playgrounds/*

patchedDependencies:
  event-target-shim@6.0.2: patches/event-target-shim@6.0.2.patch

allowUnusedPatches: true

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  unrs-resolver: true

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@nuxt/devtools': 4.2.0
    '@nuxt/eslint-config': ^1.17.0
    '@nuxt/module-builder': ^1.0.4
    '@nuxt/schema': ^4.7.0
    '@nuxt/test-utils': ^4.4.0
    '@types/node': ^24.19.2
    '@types/selenium-webdriver': ^4.35.7
    '@unhead/vue': 3.5.0
    '@vitejs/plugin-legacy': ^8.2.4
    browserstack-local: ^1.5.16
    eslint: ^10.15.0
    get-port-please: ^3.2.0
    node-html-parser: ^9.0.7
    nuxt: ^4.7.0
    plugin-legacy-v7: npm:@vitejs/plugin-legacy@^7.2.1
    plugin-legacy-v8: npm:@vitejs/plugin-legacy@^8.2.4
    selenium-webdriver: ^4.54.0
    typescript: ~6.0.3
    vitest: ^4.1.12
    vue-tsc: ^3.3.14
  dev:nuxt-v5:
    # eslint-disable-next-line pnpm/yaml-no-duplicate-catalog-item
    '@vitejs/plugin-legacy': ^8.2.4
    # eslint-disable-next-line pnpm/yaml-no-duplicate-catalog-item
    nuxt: npm:nuxt-nightly@5.0.0-2611231954-f3bb563
  polyfills:
    event-target-shim: ^6.0.2
  prod:
    '@nuxt/kit': ^4.7.0
    browserslist: ^4.29.6
